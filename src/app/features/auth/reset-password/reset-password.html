<div class="auth-container">
  <h1>Kies een nieuw wachtwoord</h1>

  <form (ngSubmit)="submit()" #resetForm="ngForm">
    <label>
      Nieuw wachtwoord
      <input type="password" name="password" [(ngModel)]="password" required minlength="8" autocomplete="new-password" />
    </label>

    <label>
      Herhaal nieuw wachtwoord
      <input type="password" name="passwordConfirmation" [(ngModel)]="passwordConfirmation" required autocomplete="new-password" />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="resetForm.invalid || loading() || !email || !token">
      {{ loading() ? 'Bezig...' : 'Wachtwoord opslaan' }}
    </button>
  </form>

  <p><a routerLink="/login">Terug naar inloggen</a></p>
</div>
