<div class="auth-container">
  <h1>Wachtwoord vergeten?</h1>

  @if (submitted()) {
    <p class="message">Als dit e-mailadres bekend is, ontvang je binnen enkele minuten een resetlink.</p>
  } @else {
    <p class="intro">Vul je e-mailadres in. We sturen je een link waarmee je een nieuw wachtwoord kiest.</p>
    <form (ngSubmit)="submit()" #resetForm="ngForm">
      <label>
        E-mailadres
        <input type="email" name="email" [(ngModel)]="email" required autocomplete="email" />
      </label>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="resetForm.invalid || loading()">
        {{ loading() ? 'Bezig...' : 'Stuur resetlink' }}
      </button>
    </form>
  }

  <p><a routerLink="/login">Terug naar inloggen</a></p>
</div>
